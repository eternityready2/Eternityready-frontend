<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>3abn</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background-color: #060d17;
  }

  video {
    width: 100%;
    height: auto;
    max-height: 100vh;
    display: block;
    background-color: #060d17;
  }
</style>
</head>
<body>

  <video id="video" width="100%" height="100%" controls autoplay></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const videoSrc = 'https://fuel-streaming-prod01.fuelmedia.io/v1/sep/38b3498c-5f89-44ac-9ec1-67c76ee53d02/b29d27bb-88af-42d1-937a-5bdf76b71c17/6S600K360AWS/SM/content.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', function () {
        video.play();
      });
    }
  </script>

</body>
</html>
