<head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./login.css" />
    <link rel="stylesheet" href="/lib/toast.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <title>Eternity Ready | Login </title>
    <!-- Icon config -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="/image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="/image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link rel="icon" href="/public/favicon.ico" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <eternity-header></eternity-header>
    <main>
        <div id="left">
          <a href="/new-homepage">
            <img
                src="./public/logo.png"
            />
          </a>
            <h1>Sign in</h1>
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>

            <form id = "login">
                <section>
                    <label for="email">Email</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Type your email"
                        required
                    />
                </section>
                <section>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Type your password"
                        required
                    />
                </section>
                <section id="check-and-forgot-password">
                    <div>
                        <input type="checkbox" id="remember-me" name="remember-me" value="0">
                        <label for="remember-me">Remember me</label><br>
                    </div>
                    <a href="/forget-password">Forgot password?</a>
                </section>
                <button type="submit">Log In</button>
            </form>
            <p> Don't have an account? <a href="/register">Sign Up!</a> </p>
        </div>
        <div id="right">
            <img src="./public/media.jpg"/>
        </div>
    </main>

    <eternity-salvation></eternity-salvation>
    <eternity-footer></eternity-footer>
    <script src="/lib/constants.js"></script>
    <script src="/lib/session.js"></script>
    <script src="/lib/toast.js"></script>
    <script src="/lib/utils.js"></script>
    <script src="/lib/eternityHeader.js"></script>
    <script src="/lib/eternitySalvation.js"></script>
    <script src="/lib/eternityFooter.js"></script>
    <script>
      function createGoogleOnloadDiv() {
        if (document.getElementById('g_id_onload')) return;
        
        const gIdOnload = document.createElement('div');
        gIdOnload.id = 'g_id_onload';
        gIdOnload.setAttribute('data-client_id', GOOGLE_CLIENT_ID);
        gIdOnload.setAttribute('data-context', 'signin');
        gIdOnload.setAttribute('data-ux_mode', 'popup');
        gIdOnload.setAttribute('data-callback', 'handleGoogleSignIn');
        gIdOnload.setAttribute('data-auto_prompt', 'false');
        
        const leftDiv = document.querySelector('#left');
        const signinButton = leftDiv.querySelector('.g_id_signin');
        leftDiv.insertBefore(gIdOnload, signinButton);
        
        if (window.google && google.accounts) {
          google.accounts.id.renderButton();
        }
        
        console.log('Google onload div created:', GOOGLE_CLIENT_ID);
      }

      if (typeof GOOGLE_CLIENT_ID !== 'undefined') {
        createGoogleOnloadDiv();
      } else {
        document.addEventListener('DOMContentLoaded', createGoogleOnloadDiv);
      }
    </script>
    <script>
        const form = document.getElementById('login');
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          const query = `
            mutation Login($email: String!, $password: String!) {
              authenticateUserWithPassword(email: $email, password: $password) {
                ... on UserAuthenticationWithPasswordSuccess {
                  sessionToken
                  item {
                    id
                    email
                    privilege
                  }
                }
                ... on UserAuthenticationWithPasswordFailure {
                  message
                }
              }
            }
          `;
          const variables = { email, password };

          try {
            const response = await fetch(`${API_BASE_URL}/api/graphql`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });

            const result = await response.json();

            if (result.errors) {
              console.error('Error login user:', result.errors);
              addToastAndRemoveLast(
                "Error", result.errors[0].message, "error"
              );
            } else {
              const authResult = result.data.authenticateUserWithPassword;
              console.log(authResult);
              if (authResult.item) {
                addToastAndRemoveLast(
                  "Success",
                  `Logged In successfully: ${authResult.item.email}. Redirecting to eternityready.com/new-homepage...`,
                  "success"
                );
                setSession(authResult.sessionToken)
                setTimeout(() => {
                  window.location.assign(`${ETERNITY_BASE_URL}/new-homepage`);
                }, 2500);

              } else if (authResult.message) {
                addToastAndRemoveLast(
                  "Error", authResult.message, "error"
                );

              } else {
                addToastAndRemoveLast(
                  "Error", "Unexpected login response", "error"
                );
              }
            }
          } catch (error) {
            console.error('Network error:', error);
            addToastAndRemoveLast(
              "Error", error.message, "error"
            );
          }
        });
    </script>
    <script>
      function handleGoogleSignIn(response) {
        // Send the credential to your backend
        fetch(`${API_BASE_URL}/auth/google`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            credential: response.credential,
          }),
        })
        .then(res => res.json())
        .then(data => {
          console.log('Auth successful:', data);
          addToastAndRemoveLast(
            "Success",
            `Logged In successfully: ${data.item.email}. Redirecting to eternityready.com/new-homepage...`,
            "success"
          );
          setSession(data.session)
          setTimeout(() => {
            window.location.assign(`${ETERNITY_BASE_URL}/new-homepage`);
          }, 2500);
        })
        .catch(err => {
          console.error('Auth failed:', err);
          addToastAndRemoveLast(
            "Error", "Unexpected login response", "error"
          );

        });
      }
    </script>
</body>
