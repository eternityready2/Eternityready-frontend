<head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="./register.css" />
    <link rel="stylesheet" href="/lib/toast.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <title>Eternity Ready | Register </title>
    <!-- Icon config -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/public/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="/image/png"
      sizes="32x32"
      href="/public/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="/image/png"
      sizes="16x16"
      href="/public/favicon-16x16.png"
    />
    <link rel="icon" href="/public/favicon.ico" />
    <link rel="manifest" href="/public/site.webmanifest" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <eternity-header></eternity-header>
    <main>
        <div id="left">
          <a href="/new-homepage">
            <img
                src="./public/logo.png"
            />
          </a>
            <h1> Sign Up </h1>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
            <form id="register">
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="First Name"
                    required
                />
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Last Name"
                    required
                />
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    required
                />
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                />
                <section>
                    <input
                        type="checkbox"
                        id="conditions"
                        name="conditions"
                        required
                    />
                    <label for="conditions">Accept Terms and Conditions</label>
                </section>

                <button type="submit">Register now</button>
            </form>
        </div>
        <div id="right">
            <img src="./public/media.jpg"/>
        </div>
    </main>
    <eternity-salvation></eternity-salvation>
    <eternity-footer></eternity-footer>
    <script src="/lib/constants.js"></script>
    <script src="/lib/session.js"></script>
    <script src="/lib/toast.js"></script>
    <script src="/lib/utils.js"></script>
    <script src="/lib/eternityHeader.js"></script>
    <script src="/lib/eternitySalvation.js"></script>
    <script src="/lib/eternityFooter.js"></script>
    <script>
      function createGoogleOnloadDiv() {
        if (document.getElementById('g_id_onload')) return;
        
        const gIdOnload = document.createElement('div');
        gIdOnload.id = 'g_id_onload';
        gIdOnload.setAttribute('data-client_id', GOOGLE_CLIENT_ID);
        gIdOnload.setAttribute('data-context', 'signin');
        gIdOnload.setAttribute('data-ux_mode', 'popup');
        gIdOnload.setAttribute('data-callback', 'handleGoogleSignIn');
        gIdOnload.setAttribute('data-auto_prompt', 'false');
        
        const leftDiv = document.querySelector('#left');
        const signinButton = leftDiv.querySelector('.g_id_signin');
        leftDiv.insertBefore(gIdOnload, signinButton);
        
        if (window.google && google.accounts) {
          google.accounts.id.renderButton();
        }
        
        console.log('Google onload div created:', GOOGLE_CLIENT_ID);
      }

      if (typeof GOOGLE_CLIENT_ID !== 'undefined') {
        createGoogleOnloadDiv();
      } else {
        document.addEventListener('DOMContentLoaded', createGoogleOnloadDiv);
      }
    </script>
    <script>
        const form = document.getElementById('register');
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const firstName = document.getElementById('firstName').value;
          const lastName = document.getElementById('lastName').value;
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          const query = `
            mutation CreateUser(
            $firstName: String!,
            $lastName: String!,
            $email: String!,
            $password: String!) {
              createUser(data: { firstName: $firstName, lastName: $lastName, email: $email, password: $password }) {
                id
                firstName
                email
              }
            }
          `;

          const variables = { firstName, lastName, email, password };

          try {
            const response = await fetch(`${API_BASE_URL}/api/graphql`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });

            const result = await response.json();

            if (result.errors) {
              console.error('Error creating user:', result.errors);
              addToastAndRemoveLast(
                "Error", `Error creating user: ${result.errors[0].message}`, "error"
              );

            } else {
              addToastAndRemoveLast(
                "Success", `User created successfully: ${email}. Redirecting to login...`, "success"
              );
              setTimeout(() => {
                window.location.assign(`${ETERNITY_BASE_URL}/login`);
              }, 2500);
            }
          } catch (error) {
            console.error('Network error:', error);
            addToastAndRemoveLast(
              "Error", error.message, "error"
            );
          }
        });
    </script>
    <script>
      function handleGoogleSignIn(response) {
        // Send the credential to your backend
        fetch(`${API_BASE_URL}/auth/google`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            credential: response.credential,
          }),
        })
        .then(res => res.json())
        .then(data => {
          console.log('Auth successful:', data);
          addToastAndRemoveLast(
            "Success",
            `Register In successfully: ${data.item.email}. Redirecting to eternityready.com/new-homepage...`,
            "success"
          );
          setSession(data.session)
          setTimeout(() => {
            window.location.assign(`${ETERNITY_BASE_URL}/new-homepage`);
          }, 2500);
        })
        .catch(err => {
          console.error('Auth failed:', err);
          addToastAndRemoveLast(
            "Error", "Unexpected login response", "error"
          );

        });
      }
    </script>
</body>
