<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TMFGS53Q"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

    <eternity-header></eternity-header>
    <main>
        <div id="left">
          <a href="/new-homepage">
            <img
                src="./public/logo.png"
            />
          </a>
            <h1> Sign Up </h1>

            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
            <form id="register">
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="First Name"
                    required
                />
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Last Name"
                    required
                />
                <input
                    type="text"
                    id="email"
                    name="email"
                    placeholder="Email Address"
                    required
                />
                <div id="password-field-and-requeriments">
                  <div id="password-field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Type your password"
                    />
                    <span class="material-symbols-outlined">visibility_off</span>
                  </div>
                  <div>
                    <div id="atleastEightChars">
                      <span class="material-symbols-outlined">close</span>
                      <span>At least 8 characters</span>
                    </div>
                    <div id="containsDigit">
                      <span class="material-symbols-outlined">close</span>
                      <span>Contains a digit</span>
                    </div>
                    <div id="containsLowercase">
                      <span class="material-symbols-outlined">close</span>
                      <span>Contains a lowercase letter</span>
                    </div>
                    <div id="containsUppercase">
                      <span class="material-symbols-outlined">close</span>
                      <span>Contains an uppercase letter</span>
                    </div>
                    <div id="containsSymbol">
                      <span class="material-symbols-outlined">close</span>
                      <span>Contains a symbol</span>
                    </div>
                  </div>
                </div>
                <section>
                    <input
                        type="checkbox"
                        id="conditions"
                        name="conditions"
                        required
                    />
                    <label for="conditions">Accept Terms and Conditions</label>
                </section>

                <button type="submit">Register now</button>
            </form>
        </div>
        <div id="right">
            <img src="./public/media.jpg"/>
        </div>
    </main>
    <eternity-salvation></eternity-salvation>
    <eternity-footer></eternity-footer>
    <script src="/lib/constants.js"></script>
    <script src="/lib/session.js"></script>
    <script src="/lib/toast.js"></script>
    <script src="/lib/utils.js"></script>
    <script src="/lib/ads.js"></script>
    <script src="/lib/eternityHeader.js"></script>
    <script src="/lib/eternitySalvation.js"></script>
    <script src="/lib/eternityFooter.js"></script>
    <script>
      function createGoogleOnloadDiv() {
        if (document.getElementById('g_id_onload')) return;
        
        const gIdOnload = document.createElement('div');
        gIdOnload.id = 'g_id_onload';
        gIdOnload.setAttribute('data-client_id', GOOGLE_CLIENT_ID);
        gIdOnload.setAttribute('data-context', 'signin');
        gIdOnload.setAttribute('data-ux_mode', 'popup');
        gIdOnload.setAttribute('data-callback', 'handleGoogleSignIn');
        gIdOnload.setAttribute('data-auto_prompt', 'false');
        
        const leftDiv = document.querySelector('#left');
        const signinButton = leftDiv.querySelector('.g_id_signin');
        leftDiv.insertBefore(gIdOnload, signinButton);
        
        if (window.google && google.accounts) {
          google.accounts.id.renderButton();
        }
        
        console.log('Google onload div created:', GOOGLE_CLIENT_ID);
      }

      if (typeof GOOGLE_CLIENT_ID !== 'undefined') {
        createGoogleOnloadDiv();
      } else {
        document.addEventListener('DOMContentLoaded', createGoogleOnloadDiv);
      }
    </script>
    <script>
        const form = document.getElementById('register');
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const passwordInput = document.getElementById('password');
          passwordInput.setCustomValidity('');

          for (const requeriment of document.querySelectorAll('#password-field-and-requeriments .material-symbols-outlined')) {
            if (requeriment.textContent === 'close') {
              passwordInput.setCustomValidity('This field is required');
              passwordInput.reportValidity();
              return;
            }
          }
          
          passwordInput.setCustomValidity('');

          const firstName = document.getElementById('firstName').value;
          const lastName = document.getElementById('lastName').value;
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;

          const query = `
            mutation CreateUser(
            $firstName: String!,
            $lastName: String!,
            $email: String!,
            $password: String!) {
              createUser(data: { firstName: $firstName, lastName: $lastName, email: $email, password: $password }) {
                id
                firstName
                email
              }
            }
          `;

          const variables = { firstName, lastName, email, password };

          try {
            const response = await fetch(`${API_BASE_URL}/api/graphql`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query, variables }),
            });

            const result = await response.json();

            if (result.errors) {
              console.error('Error creating user:', result.errors);

              const emailExists = (
                result.errors[0]?.extensions?.prisma?.code === 'P2002'
                && result.errors[0]?.extensions?.prisma?.meta?.target?.includes('email')
              );

              if (emailExists) {
                addToastAndRemoveLast(
                  "Error", `Email '${email}' is already registered...`, "error"
                );
              }
              
            } else {
              addToastAndRemoveLast(
                "Checkout", `Redirecting ${email} to checkout...`, "success"
              );

              const res = await fetch(`${API_BASE_URL}/api/create-checkout-session`, {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    userId: result.data.createUser.id,
                  }),
              });

              const dataCheckout = await res.json();
              if (dataCheckout.url) {
                setTimeout(() => {
                  window.location.assign(dataCheckout.url);
                }, 2500);
              }
            }
          } catch (error) {
            console.error('Network error:', error);
            addToastAndRemoveLast(
              "Error", error.message, "error"
            );
          }
        });
    </script>
    <script>
      function handleGoogleSignIn(response) {
        // Send the credential to your backend
        fetch(`${API_BASE_URL}/auth/google`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            credential: response.credential,
          }),
        })
        .then(res => res.json())
        .then(async (data) => {
          console.log('Auth successful:', data);

          if (!data.item.privilege || data.item.privilege === "normal") {
            addToastAndRemoveLast(
              "Checkout", `Redirecting ${data.item.email} to checkout...`, "success"
            );

            const res = await fetch(`${API_BASE_URL}/api/create-checkout-session`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${data.session}`
                },
            });

            const dataCheckout = await res.json();
            if (dataCheckout.url) {
              setTimeout(() => {
                window.location.assign(dataCheckout.url);
              }, 2500);
            }

            return;
          }

          const redirectUrl = localStorage.getItem('userPosition') ?? `${ETERNITY_BASE_URL}/new-homepage`;
          localStorage.removeItem('userPosition');

          addToastAndRemoveLast(
            "Success",
            `Log In successfully: ${data.item.email}. Redirecting to ${redirectUrl.slice(0, 20)}...`,
            "success"
          );

          setSession(data.session)

          setTimeout(() => {
            window.location.assign(redirectUrl);
          }, 2500);
        })
        .catch(err => {
          console.error('Auth failed:', err);
          addToastAndRemoveLast(
            "Error", "Unexpected login response", "error"
          );

        });
      }
    </script>
    <script>
      const passwordField = document.querySelector('#password-field');
      const visibilityBtn = passwordField.querySelector('span');
      const passwordFieldInput = passwordField.querySelector('input');
      const requeriments = document.querySelector('#password-field-and-requeriments > div:nth-child(2)');
      visibilityBtn.addEventListener('click', () => {
        visibilityBtn.textContent = (
          visibilityBtn.textContent === 'visibility'
            ? 'visibility_off'
            : 'visibility'
        );
        if (passwordFieldInput.type === "password") {
          passwordFieldInput.type = "text";
        } else {
          passwordFieldInput.type = "password";
        }
      });

      passwordFieldInput.addEventListener('focus', () => {
        passwordField.style.outline = "1px solid red";
        requeriments.style.display = 'block';
      });

      passwordFieldInput.addEventListener('blur', () => {
        passwordField.style.outline = "none";
      });

    </script>
    <script>
      passwordFieldInput.addEventListener('input', (e) => {
        const passwd = e.target.value;
        const atleastEightChars = document.querySelector("#atleastEightChars span");
        const containsDigit = document.querySelector("#containsDigit span");
        const containsLowercase = document.querySelector("#containsLowercase span");
        const containsUppercase = document.querySelector("#containsUppercase span");
        const containsSymbol = document.querySelector("#containsSymbol span");
        
        passwordFieldInput.setCustomValidity('');
        if (passwd.length < 8) {
          atleastEightChars.textContent = 'close'
        }

        else {
          atleastEightChars.textContent = 'check'
        }


        if (!(/\d/.test(passwd))) {
          containsDigit.textContent = 'close'
        }

        else {
          containsDigit.textContent = 'check'
        }

        if (!(/[a-z]/.test(passwd))) {
          containsLowercase.textContent = 'close'
        }

        else {
          containsLowercase.textContent = 'check'
        }

        if (!(/[A-Z]/.test(passwd))) {
          containsUppercase.textContent = 'close'
        }

        else {
          containsUppercase.textContent = 'check'
        }

        if (!(/[^A-Za-z0-9]/.test(passwd))) {
          containsSymbol.textContent = 'close'
        }

        else {
          containsSymbol.textContent = 'check'
        }
      });
    </script>
</body>
