<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="theme-color" content="#060d17">
<title>Eternity Ready — Salvation / Discipleship Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="https://eternityready.com/salvation/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="https://eternityready.com/lib/toast.css">
<link rel="stylesheet" href="https://eternityready.com/lib/ads.css">
<style>
:root{--er-bg:#060d17;--er-red:#fb2c36;--er-teal:#33c3a5}html{background:#060d17}body{background:#060d17!important}.fade-in{opacity:1!important;transform:none!important}.preview-badge{position:fixed;right:12px;bottom:12px;z-index:1000;padding:9px 12px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(6,13,23,.92);color:#cbd5e1;font:600 12px system-ui;backdrop-filter:blur(12px)}.handoff{padding:88px 20px;background:radial-gradient(circle at 20% 10%,rgba(51,195,165,.12),transparent 28rem),radial-gradient(circle at 85% 50%,rgba(251,44,54,.11),transparent 26rem),#060d17}.handoff-card{max-width:980px;margin:auto;padding:38px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:linear-gradient(150deg,rgba(16,29,45,.98),rgba(7,16,27,.98));box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.handoff-step{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(51,195,165,.12);border:1px solid rgba(51,195,165,.32);color:#8ef0d9;font-weight:800;font-size:.8rem;letter-spacing:.09em;text-transform:uppercase}.handoff h2{font-size:clamp(2rem,5vw,4rem);line-height:1.02;margin:18px 0 12px;color:#fff}.handoff p{max-width:720px;margin:0 auto 24px;color:#b6c0cd;font-size:1.05rem}.handoff .btn{background:linear-gradient(135deg,#ff414b,#d71924)!important;border:none!important;color:#fff!important;font-weight:800}.handoff .small{margin-top:14px;color:#8996a6;font-size:.83rem}.preview-loading{min-height:70vh;display:grid;place-items:center;color:#fff;font:600 18px Montserrat,sans-serif}.preview-error{max-width:760px;margin:80px auto;padding:30px;color:#fff;background:#111c2c;border:1px solid rgba(255,255,255,.15);border-radius:16px}.hero{margin-top:0!important}@media(max-width:640px){.handoff{padding:64px 16px}.handoff-card{padding:28px 20px}.preview-badge{display:none}}
</style>
</head>
<body>
<eternity-header></eternity-header>
<div class="preview-badge" id="previewBadge">PREVIEW</div>
<main id="app"><div class="preview-loading">Loading Eternity Ready preview…</div></main>
<eternity-footer></eternity-footer>
<script src="https://eternityready.com/lib/constants.js"></script>
<script src="https://eternityready.com/lib/session.js"></script>
<script src="https://eternityready.com/lib/toast.js"></script>
<script src="https://eternityready.com/lib/utils.js"></script>
<script src="https://eternityready.com/lib/normalize.js"></script>
<script src="https://eternityready.com/lib/media-section.js"></script>
<script src="https://eternityready.com/lib/ads.js"></script>
<script src="https://eternityready.com/lib/eternityHeader.js"></script>
<script src="https://eternityready.com/lib/eternityFooter.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
(async()=>{
 const app=document.getElementById('app');
 const mode=new URLSearchParams(location.search).get('page')==='discipleship'?'discipleship':'salvation';
 document.getElementById('previewBadge').textContent=mode==='discipleship'?'PREVIEW · Discipleship':'PREVIEW · Salvation split';
 document.title=mode==='discipleship'?'Start Your Christian Journey — Discipleship Preview':'Salvation Preview — Step 3 Split';
 const raw='https://raw.githubusercontent.com/eternityready2/Eternityready-frontend/master/salvation/index.html';
 const base='https://eternityready.com/salvation/';
 function abs(value){if(!value||value.startsWith('#')||/^(https?:|mailto:|tel:|data:|javascript:)/i.test(value))return value;try{return new URL(value,base).href}catch{return value}}
 function clean(root){
   root.querySelectorAll('script,eternity-header,eternity-footer').forEach(n=>n.remove());
   root.querySelectorAll('[src]').forEach(n=>n.setAttribute('src',abs(n.getAttribute('src'))));
   root.querySelectorAll('[href]').forEach(n=>n.setAttribute('href',abs(n.getAttribute('href'))));
   root.querySelectorAll('[style]').forEach(n=>{let s=n.getAttribute('style');s=s.replace(/url\((['"]?)(\.\/?[^)'\"]+)\1\)/g,(m,q,u)=>`url('${abs(u)}')`);n.setAttribute('style',s)});
   return root;
 }
 try{
   const r=await fetch(raw,{cache:'no-store'}); if(!r.ok)throw new Error('Source returned '+r.status);
   const doc=new DOMParser().parseFromString(await r.text(),'text/html');
   const children=[...doc.body.children];
   const hero=children.find(n=>n.matches?.('.hero'));
   const step3=children.find(n=>n.matches?.('.section-header')&&n.textContent.includes('Start Your Christian Journey'));
   if(!hero||!step3)throw new Error('Could not locate the Salvation split points.');
   const frag=document.createDocumentFragment();
   if(mode==='salvation'){
     const start=children.indexOf(hero), end=children.indexOf(step3);
     children.slice(start,end).forEach(n=>frag.append(clean(n.cloneNode(true))));
     const handoff=document.createElement('section');handoff.className='handoff';handoff.innerHTML=`<div class="handoff-card"><span class="handoff-step">Step 3 · Your next step</span><h2>Start Your Christian Journey</h2><p>You’ve learned the Gospel and how to begin a new life with Jesus. Now continue into discipleship: get resources, find a church, build a prayer and Bible-study life, and grow in your relationship with God.</p><a class="btn" href="?page=discipleship">Continue to Step 3 — Start My Christian Journey</a><div class="small">New believer, rededicating your life, or ready to grow deeper? This is your next page.</div></div>`;frag.append(handoff);
   }else{
     frag.append(clean(hero.cloneNode(true)));
     const start=children.indexOf(step3); let end=children.findIndex((n,i)=>i>start&&n.tagName==='ETERNITY-FOOTER'); if(end<0)end=children.length;
     children.slice(start,end).forEach(n=>frag.append(clean(n.cloneNode(true))));
   }
   app.replaceChildren(frag);
   if(mode==='salvation'){
     const need=app.querySelector('.hero-buttons a[href*="prayer-form"]');if(need)need.href='?page=discipleship#prayer-form';
     const yes=[...app.querySelectorAll('a.btn')].find(a=>a.textContent.includes('Say Yes to Jesus'));const prayer=[...app.querySelectorAll('.sinners-prayer')][0];if(yes&&prayer){prayer.id='sinners-prayer';yes.href='#sinners-prayer'}
   }else{
     const learn=app.querySelector('.hero-buttons a:first-child');if(learn){learn.href='#growth';learn.textContent='Start Step 3'}
     const verse=app.querySelector('#verse-text');const ref=app.querySelector('#verse-ref');if(verse&&/Loading/i.test(verse.textContent)){verse.textContent='“Therefore, if anyone is in Christ, the new creation has come: The old has gone, the new is here!”';if(ref)ref.textContent='2 Corinthians 5:17'}
     if(app.querySelector('.testimonial-swiper'))new Swiper('.testimonial-swiper',{loop:true,spaceBetween:24,pagination:{el:'.swiper-pagination',clickable:true},navigation:{nextEl:'.swiper-button-next',prevEl:'.swiper-button-prev'},breakpoints:{0:{slidesPerView:1},900:{slidesPerView:2}}});
     window.openPopup=url=>window.open(url.replace('/embed/','/watch?v='),'_blank');window.closePopup=()=>{};
     const check=app.querySelector('#check-result');if(check)check.addEventListener('click',()=>{const boxes=[...app.querySelectorAll('#eternity-check-form input[type=checkbox]')],count=boxes.filter(x=>x.checked).length,msg=app.querySelector('#result-message');if(msg){msg.classList.remove('hidden');const p=msg.querySelector('p');if(p)p.textContent=count>=5?'You are building strong discipleship habits. Keep growing, stay connected to Scripture, prayer and Christian community.':'Looks like you’re still on your way — and that’s okay. Use the resources below to strengthen your next steps.'}});
     const search=app.querySelector('#search');if(search)search.addEventListener('click',()=>{const zip=app.querySelector('#cep')?.value.trim(),map=app.querySelector('.find-map iframe');if(zip&&map)map.src='https://www.google.com/maps?q='+encodeURIComponent('church near '+zip)+'&output=embed'});
     window.moveCarousel=dir=>app.querySelector('#carouselWrapper')?.scrollBy({left:dir*340,behavior:'smooth'});
   }
   if(location.hash)setTimeout(()=>document.querySelector(location.hash)?.scrollIntoView({behavior:'smooth'}),150);
 }catch(err){app.innerHTML=`<div class="preview-error"><h2>Preview could not load</h2><p>${err.message}</p><p>Please refresh the page.</p></div>`}
})();
</script>
</body></html>
